name: Windows safety regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Isolated Windows safety tests
        shell: ${{ matrix.shell }}
        run: ./tests/windows-safety.ps1
